{% extends "base.html" %}
{% load static %}

{% block subheader_actions %}
    <a href="{% url 'farmers:farmer_list' %}"
       class="btn btn-sm {% if request.resolver_match.url_name == 'farmer_list' %}btn-primary{% else %}btn-outline{% endif %}">
        <i class="bi bi-people"></i> Farmers
    </a>
    <a href="{% url 'farmers:farm_list' %}"
       class="btn btn-sm {% if 'farm' in request.resolver_match.url_name and 'map' not in request.resolver_match.url_name %}btn-primary{% else %}btn-outline{% endif %}">
        <i class="bi bi-geo-alt"></i> Farms
    </a>
    <a href="{% url 'farmers:farm_map' %}"
       class="btn btn-sm {% if request.resolver_match.url_name == 'farm_map' %}btn-primary{% else %}btn-outline{% endif %}">
        <i class="bi bi-map"></i> Map
    </a>
    {% if request.user.is_kalro_staff or request.user.is_superuser %}
    <a href="{% url 'farmers:bulk_import' %}"
       class="btn btn-sm btn-outline">
        <i class="bi bi-upload"></i> Import
    </a>
    {% endif %}
{% endblock %}

{% block content %}{% endblock %}
